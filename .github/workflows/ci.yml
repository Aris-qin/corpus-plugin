# corpus-plugin CI
# - python: pytest corpus/tests (111 contract + unit tests)
# - node: corpus-query plugin build + smoke (5/5 tools real execute)
# - e2e: full pipeline (init -> register -> process -> query -> score) over a throwaway DB
# fact-infra is intentionally excluded: it is an existing artifact (2026-09-02),
# out of scope for this project's regression gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          # sqlite-vec ships prebuilt wheels for cp311 on PyPI; fallback to source if missing.
          python -m pip install "sqlite-vec>=0.1.6" pytest
      - name: pytest
        run: python -m pytest corpus/tests/ -v

  corpus-query:
    name: corpus-query plugin build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install pnpm
        run: npm install -g pnpm@9
      - name: install deps
        run: |
          cd plugins/corpus-query
          pnpm install --frozen-lockfile
      - name: build
        run: |
          cd plugins/corpus-query
          pnpm build
      - name: smoke (5/5 tools execute)
        run: |
          cd plugins/corpus-query
          bash test/smoke.mjs
        env:
          CORPUS_CLI_PATH: ${{ github.workspace }}/corpus/cli.py
          CORPUS_CHUNK_HELPER_PATH: ${{ github.workspace }}/plugins/corpus-query/chunk_query.py
          CORPUS_QUERY_MODE: spawn
          PYTHONPATH: ${{ github.workspace }}/corpus

  e2e:
    name: pipeline e2e (throwaway DB)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install sqlite-vec
        run: python -m pip install "sqlite-vec>=0.1.6"
      - name: run e2e
        run: bash corpus/tests/e2e.sh